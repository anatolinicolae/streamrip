[project]
name = "streamrip"
version = "2.3.2"
description = "A fast, all-in-one music downloader for Qobuz, Deezer, Tidal, and SoundCloud"
authors = [{ name = "nathom", email = "nathanthomas707@gmail.com" }]
license = { text = "GPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["hi-res", "free", "music", "download"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License (GPL)",
  "Operating System :: OS Independent",
]
dependencies = [
  "mutagen>=1.45.1,<2",
  "tomlkit>=0.7.2,<1",
  "pathvalidate>=3.3.1,<4",
  "simple-term-menu>=1.2.1,<2 ; sys_platform == 'darwin' or sys_platform == 'linux'",
  "pick>=2,<3 ; sys_platform == 'win32' or sys_platform == 'cygwin'",
  "windows-curses>=2.2.0,<3 ; sys_platform == 'win32' or sys_platform == 'cygwin'",
  "Pillow>=12,<13",
  "deezer-py==1.3.7",
  "pycryptodomex>=3.10.1,<4",
  "appdirs>=1.4.4,<2",
  "m3u8>=0.9.0",
  "aiofiles>=0.7",
  "aiohttp>=3.9,<4",
  "aiodns>=4.0.3,<5",
  "aiolimiter>=1.1.0,<2",
  "rich>=15,<16",
  "click-help-colors>=0.9.2",
]

[project.optional-dependencies]
ssl = ["certifi>=2025.1.31"]

[project.scripts]
rip = "streamrip.rip:rip"

[project.urls]
Homepage = "https://github.com/nathom/streamrip"
Repository = "https://github.com/nathom/streamrip"
"Bug Reports" = "https://github.com/nathom/streamrip/issues"

[dependency-groups]
dev = [
  "types-click>=7.1.2",
  "types-Pillow>=8.3.1",
  "ruff>=0.1",
  "black>=24",
  "isort>=5.9.3",
  "setuptools>=67.4.0",
  "pytest>=7.4",
  "pytest-mock>=3.11.1",
  "pytest-asyncio>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["streamrip"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
log_level = "DEBUG"
asyncio_mode = 'auto'
log_cli = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ASYNC", "N", "RUF", "ERA001"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
